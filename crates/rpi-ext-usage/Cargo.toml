[package]
name = "rpi-ext-usage"
description = "Usage lookup (L0 native plugin, TE44/TE53): /usage queries the current provider's typed balance, plan quota or subscription windows through the host scripted usage-provider framework (built-in DeepSeek / GLM Coding Plan / MiniMax Token Plan / Kimi Code / OpenCode Go / Anthropic / OpenAI Codex / xAI scripts) and keeps a typed footer status line"
version.workspace = true
edition.workspace = true
license.workspace = true

# rlib: all logic lives in the library for unit tests; cdylib is the
# distributed artifact loaded by rpi-ext-host's native loader
# (rpi-ext-todo / rpi-ext-plan-mode Cargo.toml precedent; plugin
# 02-design §1). No HTTP client dependency: every provider call runs
# through the host's scripted usage-provider framework.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Native ABI types (RpiNativeModule / RpiHostCalls) for the cdylib thin shell.
rpi-ext-host.workspace = true
abi_stable = "0.11"
# RFC3339 typed reset parsing (typed footer countdown / static label).
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
rpi-test-env.workspace = true
# TE53 joint frames use the host's exact status-line wrap helper (the same
# function the built-in footer uses).
rpi-tui.workspace = true
