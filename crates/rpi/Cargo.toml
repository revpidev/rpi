[package]
name = "rpi"
description = "Port of @earendil-works/pi-coding-agent: CLI modes + lib SDK (the single assembly point)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rpi"
path = "src/main.rs"

[[bin]]
name = "rpi-rpc"
path = "src/bin/rpi_rpc.rs"

[dependencies]
rpi-ai.workspace = true
rpi-agent.workspace = true
rpi-tui.workspace = true
rpi-ext-host.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
image.workspace = true
kamadak-exif.workspace = true
fs2.workspace = true
serde_yaml.workspace = true
ignore.workspace = true
globset.workspace = true
semver.workspace = true
# T14 packages: sha256 hash for temporary (`-e`) extension install dirs
# (package-manager.ts getTemporaryDir).
sha2.workspace = true
reqwest.workspace = true
httpdate.workspace = true
url.workspace = true
# T17-W2 syntax highlighting (ADR-0008): syntect replaces upstream hljs.
syntect.workspace = true

[build-dependencies]
# T17-W2: build.rs filters bat's syntax set and writes the compressed dump
# embedded into the binary (see crates/rpi/build.rs).
syntect.workspace = true
syntect-assets.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rpi-test-support.workspace = true
