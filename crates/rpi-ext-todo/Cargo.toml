[package]
name = "rpi-ext-todo"
description = "Task-list todo tool (L0 native plugin) — port of @juicesharp/rpiv-todo v2.10.1+ (0fdf4f8)"
version.workspace = true
edition.workspace = true
license.workspace = true

# rlib: all logic lives in the library for unit/parity tests; cdylib is the
# distributed artifact loaded by rpi-ext-host's native loader
# (rpi-ext-ask-user-question Cargo.toml precedent; plugin 02-design §1).
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Native ABI types (RpiNativeModule / RpiHostCalls) for the cdylib thin shell.
rpi-ext-host.workspace = true
# truncate_to_width / visible_width for the overlay row truncation — the
# same utilities the host's Text rendering uses (ask-user-question
# precedent for a plugin depending on rpi-tui utilities).
rpi-tui.workspace = true
abi_stable = "0.11"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
