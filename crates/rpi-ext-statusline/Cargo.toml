[package]
name = "rpi-ext-statusline"
description = "Claude Code-compatible script statusline (L0 native plugin, TE12): run a configured command, feed it session JSON on stdin, render its stdout as the footer"
version.workspace = true
edition.workspace = true
license.workspace = true

# rlib: all logic lives in the library for unit/integration tests; cdylib is
# the distributed artifact loaded by rpi-ext-host's native loader.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Native ABI types (RpiNativeModule / RpiHostCalls) for the cdylib thin shell.
rpi-ext-host.workspace = true
# Guest-side protocol shapes (interactive-UI component loop, sessionStats,
# emitText) shared with the wasm carrier; the native plugin drives them over
# the same JSON host-call trampoline.
rpi-ext-sdk.workspace = true
abi_stable = "0.11"
# Timestamp parsing for ctx.sessionStats' RFC3339 startedAt.
chrono.workspace = true
# Theme color parsing for items (`ui.theme` returns raw ThemeJson values:
# hex, 256-index, oklch()/okhsl()). Reusing the host's parser keeps the
# statusline palette byte-identical to the footer's color model.
rpi-tui.workspace = true
# Bundled model tokenizers: the pretokenizer patterns use look-around and
# character-class intersection (HF `Split`/tiktoken `pat_str` semantics), so
# they run on the same fancy-regex backend the upstream tokenizers use.
fancy-regex.workspace = true
regex.workspace = true
# Embed the compact tokenizer tables as zstd blobs (scripts/gen-statusline-tokenizers.py).
zstd.workspace = true
# NFC normalization for the Qwen/MiniMax tokenizers.
unicode-normalization.workspace = true
# A+B settings coordination for the /statusline editor (same protocol as the
# host and subagents writers; ADR-0040).
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
# Plugin-owned tokio runtime + script
# child-process execution (subagents runner/foreground.rs precedent).
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rpi-test-env.workspace = true
# TE52 joint frames use the host's exact status-line wrap helper (the same
# function the built-in footer uses). TE53 replaces the usage-side literal
# with the real typed footer (linking both abi_stable root modules into one
# test binary conflicts on the exported module-loader symbol).
