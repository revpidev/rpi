[package]
name = "rpi-ext-sdk"
description = "Guest SDK for rpi wasm extensions (ABI v1, wasm32-unknown-unknown)"
version = "0.1.0"
edition = "2021"
license = "MIT"


# Standalone crate: built for wasm32-unknown-unknown, not the host
# workspace's default target set.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
strip = true
