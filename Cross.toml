# cross (aarch64-unknown-linux-musl) configuration — V18-13.
#
# The static musl fallback rebuild runs through the cross container and sets
# RPI_DIST_TARGET=<target>-static so build.rs injects the `-static`
# distribution label. cross only forwards a small allow-list of environment
# variables into the container by default; opt this one in explicitly.
[build.env]
passthrough = ["RPI_DIST_TARGET"]