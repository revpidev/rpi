# Cloudflare Pages project for the revpi.dev product endpoints (ADR-0009).
#
# Deploy from the repository root:
#   cd deploy/revpi && npx wrangler pages deploy . --project-name=revpi --branch main
#
# Optional: install-count telemetry recording (functions/api/report-install.js
# writes into this KV namespace when bound):
#   npx wrangler kv namespace create ANALYTICS
# then paste the returned id below and redeploy.

name = "revpi"
compatibility_date = "2025-01-01"

# [[kv_namespaces]]
# binding = "ANALYTICS"
# id = "<paste namespace id here>"
