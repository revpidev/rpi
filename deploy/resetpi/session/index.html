<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pir session viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #1a1a1a; }
    pre { background: #f6f6f6; padding: 1rem; border-radius: 6px; overflow: auto; max-height: 70vh; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>pir session viewer</h1>
  <p id="status">Resolving gist…</p>
  <pre id="content" hidden></pre>
  <script>
    // The pir client prints share URLs as {base}#{gistId} (config.rs
    // get_share_viewer_url), so the gist id arrives in the URL fragment and
    // never reaches the server — this page reads it client-side and renders
    // the gist's raw content (JSONL session export).
    const id = location.hash.slice(1);
    if (!id) {
      document.getElementById("status").textContent =
        "No gist id in the URL fragment. Expected https://resetpi.com/session/#{gistId}";
    } else {
      fetch(`https://gist.githubusercontent.com/${id}/raw`)
        .then((r) => (r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`))))
        .then((text) => {
          document.getElementById("status").hidden = true;
          const pre = document.getElementById("content");
          pre.textContent = text;
          pre.hidden = false;
        })
        .catch((err) => {
          document.getElementById("status").textContent =
            `Could not load gist ${id}: ${err.message}. Open it directly at ` +
            `https://gist.github.com/${id}`;
        });
    }
  </script>
</body>
</html>
