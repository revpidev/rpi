# Build-time environment for the wreq/btls-sys (BoringSSL) dependency of
# rpi-ext-smart-fetch (TE06, design §3.1).
#
# btls-sys builds BoringSSL via cmake and generates bindings via bindgen
# (libclang). On this machine all three are user-level installs:
#   cmake          → ~/.local/bin            (pip install --user cmake)
#   libclang.so    → pip libclang package    (path below)
#   stddef.h etc.  → gcc 14 builtin includes (bindgen needs libclang's
#                    resource headers, which the pip wheel omits)
#
# `[env]` entries are applied only when the variable is not already set
# (force = false is the default), so a machine or CI with a system
# clang/libclang that sets its own values is not overridden.
[env]
LIBCLANG_PATH = "/home/leven/.local/lib/python3.12/site-packages/clang/native"
BINDGEN_EXTRA_CLANG_ARGS = "-isystem /usr/lib/gcc/x86_64-linux-gnu/14/include"
