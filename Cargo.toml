# Pir workspace — Rust isomorphic reimplementation of Pi (see docs/02-design.md §2).
[workspace]
resolver = "2"
members = [
    "crates/pir-ai",
    "crates/pir-agent",
    "crates/pir-tui",
    "crates/pir",
    "crates/pir-ext-host",
    "crates/pir-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates (dependency rules: docs/02-design.md §2.1, coding-standards §2.2).
pir-ai = { path = "crates/pir-ai" }
pir-agent = { path = "crates/pir-agent" }
pir-tui = { path = "crates/pir-tui" }
pir-ext-host = { path = "crates/pir-ext-host" }
pir-test-support = { path = "crates/pir-test-support" }

# External baseline (coding-standards appendix A).
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON object key order must survive round-trips (insertion order,
# like JS objects) for byte-level wire-format parity with upstream.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
jsonschema = "0.33"
regex = "1"
url = "2"
httpdate = "1"
fs2 = "0.4"
# default-features = false: only the PKCE helpers are used; pulls in neither
# reqwest nor an HTTP client of its own.
oauth2 = { version = "5", default-features = false }
axum = "0.8"

# T06 built-in tools (pir/src/tools/).
unicode-normalization = "0.1"   # NFKC/NFD for edit fuzzy matching + read path variants
libc = "0.2"                    # unix process-group kill (bash kill tree)
base64 = "0.22"                 # read tool image attachments
# Pure-Rust image decode/encode/resize for the read tool (replaces upstream Photon WASM).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
kamadak-exif = "0.6"            # EXIF orientation auto-correct on image resize

# T09 settings & resources (pir/src/core/).
serde_yaml = "0.9"              # YAML frontmatter (skills / prompt templates)
# Directory walk with .gitignore/.ignore/.fdignore chain, dotdir skip and
# symlink following for skills/prompts discovery (upstream walker semantics).
ignore = "0.4"

# T11 pir-tui core engine (coding-standards appendix A).
crossterm = "0.29"              # terminal I/O only (raw mode / read-write / size); no ratatui
unicode-width = "0.2"           # grapheme width
unicode-segmentation = "1"      # grapheme clusters

# Single self-contained binary target (coding-standards §15.4).
# No panic = "abort": the TUI relies on a panic hook to restore terminal state.
[profile.release]
lto = true
codegen-units = 1
strip = true
