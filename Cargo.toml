# Rpi workspace — Rust reimplementation of Pi (see docs/02-design.md §2).
[workspace]
resolver = "2"
members = [
    "crates/rpi-ai",
    "crates/rpi-agent",
    "crates/rpi-tui",
    "crates/rpi",
    "crates/rpi-ext-host",
    "crates/rpi-test-native-plugin",
    "crates/rpi-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates (dependency rules: docs/02-design.md §2.1, coding-standards §2.2).
rpi-ai = { path = "crates/rpi-ai" }
rpi-agent = { path = "crates/rpi-agent" }
rpi-tui = { path = "crates/rpi-tui" }
rpi-ext-host = { path = "crates/rpi-ext-host" }
rpi-test-support = { path = "crates/rpi-test-support" }

# External baseline (coding-standards appendix A).
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON object key order must survive round-trips (insertion order,
# like JS objects) for byte-level wire-format parity with upstream.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
jsonschema = "0.33"
regex = "1"
url = "2"
httpdate = "1"
fs2 = "0.4"
# default-features = false: only the PKCE helpers are used; pulls in neither
# reqwest nor an HTTP client of its own.
oauth2 = { version = "5", default-features = false }
axum = "0.8"
# T13 Bedrock 适配器手写 SigV4（设计文档 §14：不引 aws-sdk）。
sha2 = "0.10"
hmac = "0.12"
# T13 Codex 适配器：WebSocket 传输与 SSE 请求体 zstd 压缩（设计文档 §14）。
# rustls + webpki-roots，与 reqwest 的 rustls-tls 保持一致（单文件部署目标）。
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
zstd = "0.13"

# T06 built-in tools (rpi/src/tools/).
unicode-normalization = "0.1"   # NFKC/NFD for edit fuzzy matching + read path variants
libc = "0.2"                    # unix process-group kill (bash kill tree)
base64 = "0.22"                 # read tool image attachments; google-vertex ADC JWT encoding (T13)
ring = "0.17"                   # RS256 signing for google-vertex ADC service-account JWT (T13)
# Pure-Rust image decode/encode/resize for the read tool (replaces upstream Photon WASM).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
kamadak-exif = "0.6"            # EXIF orientation auto-correct on image resize

# T09 settings & resources (rpi/src/core/).
serde_yaml = "0.9"              # YAML frontmatter (skills / prompt templates)
# Directory walk with .gitignore/.ignore/.fdignore chain, dotdir skip and
# symlink following for skills/prompts discovery (upstream walker semantics).
ignore = "0.4"
# T14 optional tools: glob matching for the find tool (fd --glob equivalent).
globset = "0.4"
# T14 packages: npm semver ranges (`semver.valid`/`validRange`/`satisfies`/
# `maxSatisfying` equivalents) for package version pinning and update checks.
semver = "1"

# T17-W2 syntax highlighting (ADR-0008, D-051): syntect replaces upstream
# highlight.js 10.7.3. default-features = false + regex-fancy: pure-Rust
# fancy-regex backend, no oniguruma C dependency (musl static target).
# The syntax set is bat's curated set, filtered and re-dumped compressed by
# crates/rpi/build.rs; the runtime crate only loads the embedded dump.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
# Build-time asset source only: bat's ~200-syntax set (syntect-assets embeds
# its own syntect copy, unified to 5.3 via the caret range).
syntect-assets = { version = "0.23.6", default-features = false }

# T11 rpi-tui core engine (coding-standards appendix A).
crossterm = "0.29"              # terminal I/O only (raw mode / read-write / size); no ratatui
unicode-width = "0.2"           # grapheme width
unicode-segmentation = "1"      # grapheme clusters
# T12-S3 markdown component: comrak replaces upstream's `marked` (see
# crates/rpi-tui/src/components/markdown.rs header for the deviation record).
# default-features = false: only the parser/AST are used, no HTML rendering.
comrak = { version = "0.54", default-features = false }

# Single self-contained binary target (coding-standards §15.4).
# No panic = "abort": the TUI relies on a panic hook to restore terminal state.
[profile.release]
lto = true
codegen-units = 1
strip = true
